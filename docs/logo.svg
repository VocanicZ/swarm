<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-label="swarm logo">
  <title>swarm</title>
  <!-- the Harness hub-and-straps mark; here half the workers are spare machines that come and go -->
  <g fill="none" stroke="#1e293b" stroke-width="7" stroke-linecap="round">
    <!-- solid straps: always-on capacity -->
    <line x1="100" y1="100" x2="170" y2="100"/>
    <line x1="100" y1="100" x2="65"  y2="39.4"/>
    <line x1="100" y1="100" x2="65"  y2="160.6"/>
  </g>
  <g fill="none" stroke="#1e293b" stroke-width="7" stroke-linecap="round" stroke-dasharray="2 13">
    <!-- dashed straps: dynamic workers joining and leaving -->
    <line x1="100" y1="100" x2="135" y2="39.4"/>
    <line x1="100" y1="100" x2="30"  y2="100"/>
    <line x1="100" y1="100" x2="135" y2="160.6"/>
  </g>
  <g fill="#1e293b">
    <circle cx="170" cy="100"   r="11"/>
    <circle cx="65"  cy="39.4"  r="11"/>
    <circle cx="65"  cy="160.6" r="11"/>
  </g>
  <g fill="#fff" stroke="#1e293b" stroke-width="5">
    <circle cx="135" cy="39.4"  r="9.5"/>
    <circle cx="30"  cy="100"   r="9.5"/>
    <circle cx="135" cy="160.6" r="9.5"/>
  </g>
  <!-- hub: the always-on coordinator, amber -->
  <circle cx="100" cy="100" r="16" fill="#fff" stroke="#f59e0b" stroke-width="9"/>
</svg>
